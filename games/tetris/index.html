<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Tetris — Mohamed Elsayed</title>
<meta name="description" content="Tetris in a single HTML file: seven-bag randomiser, ghost piece, hard drop, and on-screen controls for touch.">
<meta name="theme-color" content="#6366f1">
<link rel="canonical" href="https://eng-mohamed-elsayedahmed.github.io/games/tetris/">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%236366f1'/><rect x='22' y='22' width='24' height='24' rx='4' fill='white'/><rect x='50' y='22' width='24' height='24' rx='4' fill='%23a78bfa'/><rect x='50' y='50' width='24' height='24' rx='4' fill='white'/><rect x='22' y='50' width='24' height='24' rx='4' fill='%23f472b6'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../games.css">
<script>(function(){var t=localStorage.getItem('theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);})();</script>
<style>
  .play{display:grid;grid-template-columns:1fr 96px;gap:10px;align-items:start}
  canvas#board{aspect-ratio:1/2}
  .side{display:flex;flex-direction:column;gap:.6rem}
  .side .sc{flex:none;flex-direction:column;align-items:flex-start;gap:.1rem}
  .nextbox{
    background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:.5rem;
  }
  .nextbox span{font-family:var(--mono);font-size:.6rem;text-transform:uppercase;letter-spacing:.12em;color:var(--text-3);display:block;margin-block-end:.35rem}
  canvas#next{aspect-ratio:1;background:none;border:0;border-radius:0}
  .pad{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem;margin-block-start:.25rem}
  .pad button{
    font-family:var(--mono);font-size:1rem;color:var(--text-2);
    background:var(--surface);border:1px solid var(--line-solid);border-radius:11px;
    padding:.7rem 0;cursor:pointer;
  }
  .pad button:active{background:var(--surface-2);color:var(--accent-2)}
  @media (min-width:620px){.pad{display:none}}
</style>
</head>
<body>

<div class="top wide">
  <a class="back" href="/games/">&larr; games</a>
  <h1>Tetris</h1>
</div>

<div class="stage wide">
  <div class="play">
    <canvas id="board" width="300" height="600" aria-label="Tetris board"></canvas>
    <div class="side">
      <div class="nextbox">
        <span>Next</span>
        <canvas id="next" width="120" height="120"></canvas>
      </div>
      <div class="sc"><span>Score</span><b id="score">0</b></div>
      <div class="sc"><span>Lines</span><b id="lines">0</b></div>
      <div class="sc"><span>Level</span><b id="level">1</b></div>
    </div>
  </div>
  <div class="overlay" id="overlay">
    <h2 id="ov-title">Tetris</h2>
    <p id="ov-text">Arrows to move and rotate, space to drop. On a phone use the buttons underneath.</p>
    <button class="btn" id="ov-btn" type="button">Play</button>
  </div>
</div>

<div class="pad wide">
  <button type="button" data-act="left" aria-label="Move left">←</button>
  <button type="button" data-act="rot" aria-label="Rotate">⟳</button>
  <button type="button" data-act="right" aria-label="Move right">→</button>
  <button type="button" data-act="drop" aria-label="Hard drop">⤓</button>
</div>

<p class="hint"><kbd>←</kbd> <kbd>→</kbd> move &nbsp;·&nbsp; <kbd>↑</kbd> rotate &nbsp;·&nbsp; <kbd>↓</kbd> soft drop &nbsp;·&nbsp; <kbd>space</kbd> hard drop &nbsp;·&nbsp; <kbd>P</kbd> pause</p>

<script>
(function () {
  var COLS = 10, ROWS = 20;
  var board = document.getElementById('board'), ctx = board.getContext('2d');
  var nextC = document.getElementById('next'), nctx = nextC.getContext('2d');
  var scoreEl = document.getElementById('score'), linesEl = document.getElementById('lines'), levelEl = document.getElementById('level');
  var overlay = document.getElementById('overlay');
  var ovTitle = document.getElementById('ov-title'), ovText = document.getElementById('ov-text'), ovBtn = document.getElementById('ov-btn');

  var SHAPES = {
    I: [[0,1],[1,1],[2,1],[3,1]],
    J: [[0,0],[0,1],[1,1],[2,1]],
    L: [[2,0],[0,1],[1,1],[2,1]],
    O: [[1,0],[2,0],[1,1],[2,1]],
    S: [[1,0],[2,0],[0,1],[1,1]],
    T: [[1,0],[0,1],[1,1],[2,1]],
    Z: [[0,0],[1,0],[1,1],[2,1]]
  };
  var COLORS = { I:'#22d3ee', J:'#60a5fa', L:'#fbbf24', O:'#f472b6', S:'#34d399', T:'#a78bfa', Z:'#f87171' };
  var KEYS = Object.keys(SHAPES);

  var grid, piece, nextPiece, bag = [], score, lines, level, dropMs, acc, last, state, raf, cell;

  function newGrid() {
    var g = [];
    for (var r = 0; r < ROWS; r++) g.push(new Array(COLS).fill(null));
    return g;
  }

  function refillBag() {
    bag = KEYS.slice();
    for (var i = bag.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = bag[i]; bag[i] = bag[j]; bag[j] = t;
    }
  }
  function takePiece() {
    if (!bag.length) refillBag();
    var k = bag.pop();
    return { key: k, cells: SHAPES[k].map(function (c) { return c.slice(); }), x: 3, y: 0 };
  }

  function rotated(p) {
    // rotate inside the 4x4 (or 3x3) box the shape was authored in
    var size = p.key === 'I' ? 4 : 3;
    return p.cells.map(function (c) { return [size - 1 - c[1], c[0]]; });
  }

  function collides(cells, ox, oy) {
    for (var i = 0; i < cells.length; i++) {
      var x = cells[i][0] + ox, y = cells[i][1] + oy;
      if (x < 0 || x >= COLS || y >= ROWS) return true;
      if (y >= 0 && grid[y][x]) return true;
    }
    return false;
  }

  function lock() {
    piece.cells.forEach(function (c) {
      var x = c[0] + piece.x, y = c[1] + piece.y;
      if (y >= 0) grid[y][x] = piece.key;
    });

    var cleared = 0;
    for (var r = ROWS - 1; r >= 0; r--) {
      if (grid[r].every(function (v) { return v; })) {
        grid.splice(r, 1);
        grid.unshift(new Array(COLS).fill(null));
        cleared++; r++;
      }
    }
    if (cleared) {
      lines += cleared;
      score += [0, 100, 300, 500, 800][cleared] * level;
      level = Math.floor(lines / 10) + 1;
      dropMs = Math.max(90, 800 - (level - 1) * 65);
      linesEl.textContent = lines;
      levelEl.textContent = level;
      scoreEl.textContent = score;
    }

    piece = nextPiece;
    nextPiece = takePiece();
    drawNext();
    if (collides(piece.cells, piece.x, piece.y)) gameOver();
  }

  function move(dx) {
    if (!collides(piece.cells, piece.x + dx, piece.y)) piece.x += dx;
  }
  function rotate() {
    var r = rotated(piece);
    var kicks = [0, -1, 1, -2, 2];
    for (var i = 0; i < kicks.length; i++) {
      if (!collides(r, piece.x + kicks[i], piece.y)) { piece.cells = r; piece.x += kicks[i]; return; }
    }
  }
  function softDrop() {
    if (!collides(piece.cells, piece.x, piece.y + 1)) { piece.y++; score++; scoreEl.textContent = score; }
    else lock();
  }
  function hardDrop() {
    while (!collides(piece.cells, piece.x, piece.y + 1)) { piece.y++; score += 2; }
    scoreEl.textContent = score;
    lock();
  }

  function fit() {
    var w = board.getBoundingClientRect().width || 300;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    board.width = Math.round(w * dpr);
    board.height = Math.round(w * 2 * dpr);
    ctx.setTransform(board.width / COLS, 0, 0, board.width / COLS, 0, 0);
    cell = 1;
    var nw = nextC.getBoundingClientRect().width || 120;
    nextC.width = Math.round(nw * dpr); nextC.height = Math.round(nw * dpr);
    nctx.setTransform(nextC.width / 4, 0, 0, nextC.width / 4, 0, 0);
    draw(); drawNext();
  }

  function block(c, x, y, colour, alpha) {
    c.globalAlpha = alpha === undefined ? 1 : alpha;
    c.fillStyle = colour;
    var p = 0.06;
    c.beginPath();
    var r = 0.14;
    var bx = x + p, by = y + p, bw = 1 - p * 2, bh = 1 - p * 2;
    c.moveTo(bx + r, by);
    c.arcTo(bx + bw, by, bx + bw, by + bh, r);
    c.arcTo(bx + bw, by + bh, bx, by + bh, r);
    c.arcTo(bx, by + bh, bx, by, r);
    c.arcTo(bx, by, bx + bw, by, r);
    c.closePath(); c.fill();
    c.globalAlpha = 1;
  }

  function css(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }

  function draw() {
    if (!grid) return;
    ctx.clearRect(0, 0, COLS, ROWS);
    ctx.strokeStyle = css('--grid');
    ctx.lineWidth = 0.02;
    for (var i = 1; i < COLS; i++) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, ROWS); ctx.stroke(); }
    for (var j = 1; j < ROWS; j++) { ctx.beginPath(); ctx.moveTo(0, j); ctx.lineTo(COLS, j); ctx.stroke(); }

    for (var r = 0; r < ROWS; r++)
      for (var c = 0; c < COLS; c++)
        if (grid[r][c]) block(ctx, c, r, COLORS[grid[r][c]]);

    if (piece) {
      var gy = piece.y;
      while (!collides(piece.cells, piece.x, gy + 1)) gy++;
      piece.cells.forEach(function (p) { block(ctx, p[0] + piece.x, p[1] + gy, COLORS[piece.key], 0.18); });
      piece.cells.forEach(function (p) { block(ctx, p[0] + piece.x, p[1] + piece.y, COLORS[piece.key]); });
    }
  }

  function drawNext() {
    if (!nextPiece) return;
    nctx.clearRect(0, 0, 4, 4);
    var xs = nextPiece.cells.map(function (c) { return c[0]; });
    var ys = nextPiece.cells.map(function (c) { return c[1]; });
    var ox = (4 - (Math.max.apply(null, xs) - Math.min.apply(null, xs) + 1)) / 2 - Math.min.apply(null, xs);
    var oy = (4 - (Math.max.apply(null, ys) - Math.min.apply(null, ys) + 1)) / 2 - Math.min.apply(null, ys);
    nextPiece.cells.forEach(function (c) { block(nctx, c[0] + ox, c[1] + oy, COLORS[nextPiece.key]); });
  }

  function loop(t) {
    if (state !== 'running') return;
    if (!last) last = t;
    acc += t - last;
    last = t;
    while (acc >= dropMs) {
      acc -= dropMs;
      if (!collides(piece.cells, piece.x, piece.y + 1)) piece.y++;
      else { lock(); if (state !== 'running') return; }
    }
    draw();
    raf = requestAnimationFrame(loop);
  }

  function show(title, text, label) {
    ovTitle.textContent = title; ovText.textContent = text; ovBtn.textContent = label;
    overlay.hidden = false;
  }

  function reset() {
    grid = newGrid();
    bag = [];
    piece = takePiece(); nextPiece = takePiece();
    score = 0; lines = 0; level = 1; dropMs = 800; acc = 0; last = 0;
    scoreEl.textContent = 0; linesEl.textContent = 0; levelEl.textContent = 1;
    drawNext();
  }

  function play() {
    if (state === 'over' || !grid) reset();
    state = 'running'; last = 0;
    overlay.hidden = true;
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(loop);
  }
  function pause() {
    state = 'paused';
    cancelAnimationFrame(raf);
    show('Paused', 'Score ' + score + ' on level ' + level + '.', 'Resume');
  }
  function gameOver() {
    state = 'over';
    cancelAnimationFrame(raf);
    var best = parseInt(localStorage.getItem('tetrisBest') || '0', 10);
    if (score > best) { localStorage.setItem('tetrisBest', String(score)); best = score; }
    draw();
    show('Game over', 'You scored ' + score + ' with ' + lines + ' lines. Best is ' + best + '.', 'Play again');
  }

  document.addEventListener('keydown', function (e) {
    if (state === 'running') {
      if (e.key === 'ArrowLeft') { e.preventDefault(); move(-1); draw(); }
      if (e.key === 'ArrowRight') { e.preventDefault(); move(1); draw(); }
      if (e.key === 'ArrowUp') { e.preventDefault(); rotate(); draw(); }
      if (e.key === 'ArrowDown') { e.preventDefault(); softDrop(); draw(); }
      if (e.key === ' ') { e.preventDefault(); hardDrop(); draw(); }
    }
    if (e.key === 'p' || e.key === 'P') { if (state === 'running') pause(); else play(); }
    if (e.key === 'r' || e.key === 'R') { state = 'over'; play(); }
  });

  document.querySelector('.pad').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b || state !== 'running') return;
    var a = b.dataset.act;
    if (a === 'left') move(-1);
    if (a === 'right') move(1);
    if (a === 'rot') rotate();
    if (a === 'drop') hardDrop();
    draw();
  });

  ovBtn.addEventListener('click', play);
  window.addEventListener('resize', fit);
  if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () { draw(); drawNext(); });

  reset();
  fit();
  state = 'idle';
})();
</script>
</body>
</html>
